name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要写权限
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 引擎二进制随仓库分发（1.7MB，静态链接的 arm64 ELF）。
      # 注意：官方 release 的 7z 里【只有权重，没有二进制】，所以这里只能用仓库自带的。
      - name: 准备引擎二进制
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          SRC=prebuilt/libpikafish-arm64-dotprod.so
          test -f "$SRC" || { echo "!! 仓库里缺少 prebuilt/$SRC"; exit 1; }
          cp "$SRC" app/src/main/jniLibs/arm64-v8a/libpikafish.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libpikafish.so

          TARGET=app/src/main/jniLibs/arm64-v8a/libpikafish.so
          SZ=$(stat -c %s "$TARGET")
          MAGIC=$(head -c 4 "$TARGET" | od -An -tx1 | tr -d ' \n')
          echo "引擎: $SZ 字节, magic=$MAGIC"
          # 防呆：体积必须像引擎（0.5~6MB），且必须是 ELF。
          # 上一版就是把 49MB 的权重复制进来当引擎用，这里拦住。
          if [ "$SZ" -lt 500000 ] || [ "$SZ" -gt 6000000 ]; then
            echo "!! 引擎体积异常（预期 0.5~6MB），拷错文件了"; exit 1
          fi
          if [ "$MAGIC" != "7f454c46" ]; then
            echo "!! 不是 ELF 文件，拷错文件了"; exit 1
          fi
          echo "引擎校验通过"

      # 权重 50MB 不进 git；云机器访问 GitHub 是本地速度，几秒钟就能拉完
      - name: 下载 NNUE 权重
        run: |
          set -e
          URL="https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z"
          echo "下载 $URL"
          curl -fL --retry 3 -o pf.7z "$URL"
          ls -lh pf.7z
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          7z x -y pf.7z -opf > /dev/null
          echo "--- 包内文件 ---"
          find pf -type f | head -30
          NNUE=$(find pf -type f -name '*.nnue' | head -1)
          test -n "$NNUE" || { echo "!! 权重文件缺失"; exit 1; }
          echo "选用权重: $NNUE"
          cp "$NNUE" app/src/main/assets/pikafish.nnue

          NSZ=$(stat -c %s app/src/main/assets/pikafish.nnue)
          echo "权重: $NSZ 字节"
          if [ "$NSZ" -lt 10000000 ]; then
            echo "!! 权重体积异常"; exit 1
          fi
          ls -lh app/src/main/jniLibs/arm64-v8a/ app/src/main/assets/

      - name: 跑单元测试（规则层）
        run: gradle test --no-daemon --stacktrace

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 汇总信息
        run: |
          echo "## 构建产物" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -l app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## APK 内部结构校验" >> $GITHUB_STEP_SUMMARY
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -E "libpikafish|pikafish.nnue" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          unzip -l "$APK" | grep -E "libpikafish|pikafish.nnue" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 校验 APK 里确实带了引擎和权重
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libpikafish.so|assets/pikafish.nnue" || {
            echo "!! APK 里缺少引擎或权重"; unzip -l "$APK" | head -40; exit 1; }
          echo "APK 内容校验通过"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-xiangqi-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      # 顺手发一个 Release：Release 附件可以在手机浏览器上直接点开下载，
      # 而 Actions 的 Artifact 必须登录、手机端还要解压 zip，很麻烦
      - name: 复制一份带版本号的 APK
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/xiangqi-master.apk
          ls -lh app/build/outputs/apk/debug/

      - name: 发布 Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 象棋大师 v1.0.${{ github.run_number }}（一期）
          body: |
            ## 象棋大师 · Pikafish 安卓版（一期）

            原生安卓中国象棋 App，走子由 **Pikafish 2026-01-31**（象棋版 Stockfish，arm64）计算。

            **直接下载下面的 `xiangqi-master.apk`，在手机上安装即可。**

            安装时系统会提示"未知来源应用"，需要允许。

            ### 一期功能
            - 选择执红 / 执黑
            - 原生棋盘（Canvas 绘制，无图片资源）
            - 触屏走子：点棋子 → 绿点是合法落点 → 点落点走子
            - AI 自动应对，思考时间可选 1.5 / 3 / 6 / 10 秒
            - 棋盘高亮：AI 最近一步（橙圈+箭头）、AI 历史落点（橙点）、被将军（红圈）
            - 双方着法列表（中文记谱）
            - 悔棋 / 认输 / 重开一局，**终局后仍可「悔棋再战」**

            ### 首次启动注意
            - 第一次启动要解压 50MB 权重，等十几秒，状态栏会出现"引擎启动中…"
            - 之后的**第一步**还会多花 2~3 秒（引擎预热线程池与置换表）
            - 状态栏变绿显示 `Pikafish · 6 线程 · 256MB 置换表` 即代表引擎正常

            ### 环境
            - 仅支持 arm64（2018 年以后的安卓机基本都支持）
            - 最低 Android 8.0

            引擎来自 [official-pikafish/Pikafish](https://github.com/official-pikafish/Pikafish)（GPL-3.0）。
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/xiangqi-master.apk
          fail_on_unmatched_files: true
