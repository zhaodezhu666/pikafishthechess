name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 引擎与权重不进 git（50MB），由云端在编译时下载注入，云机器访问 GitHub 是本地速度
      - name: 下载 Pikafish 引擎与权重
        run: |
          set -e
          URL="https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z"
          echo "下载 $URL"
          curl -fL --retry 3 -o pf.7z "$URL"
          ls -lh pf.7z
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          7z x -y pf.7z -opf > /dev/null
          echo "--- 包内结构 ---"
          find pf -maxdepth 2 -type d | head -20
          echo "--- 候选可执行文件 ---"
          find pf -type f \( -name 'pikafish*' -o -name '*armv8*' \) | head -30

          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets

          # 优先 dotprod（ARMv8.2+ 手机快 20~30%），没有就退到普通 armv8
          EXE=$(find pf -type f -name 'pikafish-armv8-dotprod' | head -1)
          if [ -z "$EXE" ]; then
            EXE=$(find pf -type f -name '*armv8*dotprod*' | head -1)
          fi
          if [ -z "$EXE" ]; then
            EXE=$(find pf -type f -name 'pikafish-armv8' | head -1)
          fi
          if [ -z "$EXE" ]; then
            echo "!! 找不到 arm64 引擎二进制，改用包内任意 pikafish*"
            EXE=$(find pf -type f -name 'pikafish*' | head -1)
          fi
          test -n "$EXE" || { echo "!! 引擎二进制缺失"; exit 1; }
          echo "选用引擎: $EXE"
          cp "$EXE" app/src/main/jniLibs/arm64-v8a/libpikafish.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libpikafish.so

          NNUE=$(find pf -type f -name '*.nnue' | head -1)
          test -n "$NNUE" || { echo "!! 权重文件缺失"; exit 1; }
          echo "选用权重: $NNUE"
          cp "$NNUE" app/src/main/assets/pikafish.nnue

          ls -lh app/src/main/jniLibs/arm64-v8a/ app/src/main/assets/

      - name: 跑单元测试（规则层）
        run: gradle test --no-daemon --stacktrace

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 汇总信息
        run: |
          echo "## 构建产物" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -l app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-xiangqi-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
