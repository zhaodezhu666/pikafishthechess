name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布 Release 需要写权限
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 引擎二进制随仓库分发（两份各 1.7MB，静态链接的 arm64 ELF）。
      # 注意：官方 release 的 7z 里【只有权重，没有二进制】，所以这里只能用仓库自带的。
      # 打两份是为了运行时按 CPU 指令集选：dotprod 快 20~30%，但不支持时会崩，需要 generic 兜底。
      - name: 准备引擎二进制
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          for F in libpikafish.so libpikafish-generic.so; do
            SRC="prebuilt/$F"
            test -f "$SRC" || { echo "!! 仓库里缺少 prebuilt/$F"; exit 1; }
            cp "$SRC" "app/src/main/jniLibs/arm64-v8a/$F"
            chmod +x "app/src/main/jniLibs/arm64-v8a/$F"

            TARGET="app/src/main/jniLibs/arm64-v8a/$F"
            SZ=$(stat -c %s "$TARGET")
            MAGIC=$(head -c 4 "$TARGET" | od -An -tx1 | tr -d ' \n')
            echo "$F: $SZ 字节, magic=$MAGIC"
            # 防呆：体积必须像引擎（0.5~6MB），且必须是 ELF。
            # 之前踩过「把 49MB 的权重复制进来当引擎用」的坑，这里拦住。
            if [ "$SZ" -lt 500000 ] || [ "$SZ" -gt 6000000 ]; then
              echo "!! $F 体积异常（预期 0.5~6MB），拷错文件了"; exit 1
            fi
            if [ "$MAGIC" != "7f454c46" ]; then
              echo "!! $F 不是 ELF 文件，拷错文件了"; exit 1
            fi
          done
          echo "引擎校验通过"

      # 权重 50MB 不进 git；云机器访问 GitHub 是本地速度，几秒钟就能拉完
      - name: 下载 NNUE 权重
        run: |
          set -e
          URL="https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-09-06/Pikafish.2026-09-06.7z"
          echo "下载 $URL"
          curl -fL --retry 3 -o pf.7z "$URL"
          ls -lh pf.7z
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          7z x -y pf.7z -opf > /dev/null
          echo "--- 包内文件 ---"
          find pf -type f | head -30
          NNUE=$(find pf -type f -name '*.nnue' | head -1)
          test -n "$NNUE" || { echo "!! 权重文件缺失"; exit 1; }
          echo "选用权重: $NNUE"
          cp "$NNUE" app/src/main/assets/pikafish.nnue

          NSZ=$(stat -c %s app/src/main/assets/pikafish.nnue)
          echo "权重: $NSZ 字节"
          if [ "$NSZ" -lt 10000000 ]; then
            echo "!! 权重体积异常"; exit 1
          fi
          ls -lh app/src/main/jniLibs/arm64-v8a/ app/src/main/assets/

      - name: 跑单元测试（规则层）
        run: gradle test --no-daemon --stacktrace

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 汇总信息
        run: |
          echo "## 构建产物" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -l app/build/outputs/apk/debug/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## APK 内部结构校验" >> $GITHUB_STEP_SUMMARY
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -E "libpikafish|pikafish.nnue" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          unzip -l "$APK" | grep -E "libpikafish|pikafish.nnue" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 校验 APK 里确实带了引擎和权重
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libpikafish|assets/pikafish.nnue" || {
            echo "!! APK 里缺少引擎或权重"; unzip -l "$APK" | head -40; exit 1; }
          for F in lib/arm64-v8a/libpikafish.so lib/arm64-v8a/libpikafish-generic.so assets/pikafish.nnue; do
            unzip -l "$APK" | grep -q "$F" || { echo "!! APK 里缺少 $F"; exit 1; }
          done
          echo "APK 内容校验通过（两个引擎版本 + 权重都在）"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-xiangqi-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      # 顺手发一个 Release：Release 附件可以在手机浏览器上直接点开下载，
      # 而 Actions 的 Artifact 必须登录、手机端还要解压 zip，很麻烦
      - name: 复制一份带版本号的 APK
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/xiangqi-master.apk
          ls -lh app/build/outputs/apk/debug/

      - name: 发布 Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 尖头鳗指导棋 v1.0.${{ github.run_number }}
          body: |
            ## 尖头鳗指导棋

            原生安卓中国象棋 App，走子由 **Pikafish 2026-01-31**（象棋版 Stockfish，arm64）计算。

            **直接下载下面的 `xiangqi-master.apk`，在手机上安装即可。**
            安装时系统会提示"未知来源应用"，需要允许。

            ### 本次更新
            - 修复「第一步闪退」：权重改为「先写临时文件 → 校验完整 → 原子改名」，
              杜绝上次残留的半个权重文件导致引擎加载失败
            - 新增 generic 引擎兜底：运行时读 `/proc/cpuinfo` 判断 CPU 是否支持
              dotprod 指令，不支持或启动失败会自动换兼容版
            - **逐级降档重试**：满配启动失败会依次尝试「换引擎版本 → 2 线程/32MB」，
              应对安卓把宿主 App 子进程一并纳入内存回收导致的启动被杀
            - **报告进程退出信号**：SIGKILL(内存回收)/SIGILL(指令集)/SIGSEGV 等直接翻译成人话
            - 启动更快：置换表 256MB → 128MB，线程数按 CPU 核心数自适应（上限 6）
            - 引擎加载期间**也能先走棋**，不再是死等
            - 新增「诊断」按钮：引擎版本、CPU 特性、权重完整性、退出信号、
              引擎日志与崩溃堆栈，可一键复制

            ### 功能
            - 选择执红 / 执黑
            - 原生棋盘（Canvas 绘制），触屏走子，绿点为合法落点
            - AI 自动应对，思考时间 1.5 / 3 / 6 / 10 秒可调
            - AI 最近一步橙圈+方向箭头、历史落点橙点、被将军红圈
            - 双方着法列表（中文记谱）
            - 悔棋 / 认输 / 重开，终局后仍可「悔棋再战」

            ### 首次启动注意
            - 第一次启动要解压 50MB 权重，等十几秒
            - 之后的**第一步**还会多花 2~3 秒（引擎预热）
            - 状态栏变绿并显示引擎版本，即代表就绪

            ### 环境
            - 仅支持 arm64（2018 年以后的安卓机基本都支持），最低 Android 8.0

            引擎来自 [official-pikafish/Pikafish](https://github.com/official-pikafish/Pikafish)（GPL-3.0）。
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/xiangqi-master.apk
          fail_on_unmatched_files: true
